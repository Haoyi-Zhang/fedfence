# Private proposal only; main guards base/tree and creates this separate branch.
name: P113 original final audit only (same ten-stage output)
on:
  push:
    branches: ['internal/p113-audit-1b58ac09c5ea']
permissions:
  contents: read
concurrency:
  group: p113-fresh-owned-native-evidence
  cancel-in-progress: false
jobs:
  original-final-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONOPTIMIZE: '0'
      PYTHONPATH: ''
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Require existing exact private identity and distinct nonmain audit ref
        shell: bash
        run: |
          set -euo pipefail
          python -B -c 'import json,os,platform,sys; e=json.load(open(os.environ["GITHUB_EVENT_PATH"])); r=e["repository"]; assert r["private"] is True and r["id"] == 1385799011 and r["owner"]["id"] == 184843647; assert os.environ["GITHUB_REPOSITORY"] == r["full_name"] == "Haoyi-Zhang/fedfence"; assert os.environ["GITHUB_REPOSITORY_ID"] == "1385799011"; assert os.environ["GITHUB_EVENT_NAME"] == "push" and os.environ["GITHUB_REF"] == "refs/heads/internal/p113-audit-1b58ac09c5ea"; assert platform.system() == "Linux" and sys.implementation.name == "cpython" and sys.version_info[:3] == (3,12,14) and not sys.flags.optimize'
          python -B owned-p113-audit/prepare_audit.py prepare --packet owned-p113-audit/inputs/audit-input.tar.gz --out "$RUNNER_TEMP/p113-final-audit"
      - name: Read-only Poppler availability and version preflight
        shell: bash
        run: |
          set -euo pipefail
          { command -v pdfinfo; command -v pdftotext; command -v pdffonts; pdfinfo -v; pdftotext -v; pdffonts -v; } 2>&1 | tee "$RUNNER_TEMP/p113-final-audit-tools.log"
      - name: Execute unchanged original auditor once (no science or measurement rerun)
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/p113-final-audit/P113/artifact"
          CPU=$(python -c 'import os; print(min(os.sched_getaffinity(0)))')
          ulimit -t 90
          ulimit -v 2097152
          timeout --signal=TERM --kill-after=10s 120s taskset -c "$CPU" python -B scripts/audit_tosem.py 2>&1 | tee "$RUNNER_TEMP/p113-final-audit.log"
      - name: Require genuine final audit and unchanged source/results/PDF
        shell: bash
        run: |
          set -euo pipefail
          python -B owned-p113-audit/prepare_audit.py verify --packet owned-p113-audit/inputs/audit-input.tar.gz --out "$RUNNER_TEMP/p113-final-audit" 2>&1 | tee "$RUNNER_TEMP/p113-final-audit-verification.log"
      - name: Retain complete output and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p113-same-output-final-audit
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            owned-p113-audit/
            ${{ runner.temp }}/p113-final-audit/
            ${{ runner.temp }}/p113-final-audit-tools.log
            ${{ runner.temp }}/p113-final-audit.log
            ${{ runner.temp }}/p113-final-audit-verification.log
