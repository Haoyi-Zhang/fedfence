name: Scientific checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p113-fresh-owned-native-evidence
  cancel-in-progress: false
jobs:
  owned-offline-models:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONOPTIMIZE: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Check separate assembler guards on the reviewed main push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 60s python -B fresh_science_tests/test_assembler.py --out "$RUNNER_TEMP/p113-assembler-guards" -v 2>&1 | tee "$RUNNER_TEMP/p113-assembler-guards.log"
      - name: Check passive evidence consumers separately from scientific stages
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 60s python -B coherence_tests/test_evidence_consumers.py -v 2>&1 | tee "$RUNNER_TEMP/p113-consumer-tests.log"
      - name: Prepare a new source-bound copy on the reviewed main push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/assemble_fresh_science.py prepare --source "$GITHUB_WORKSPACE" --workdir "$RUNNER_TEMP/p113-fresh-native" | tee "$RUNNER_TEMP/p113-fresh-prepare.log"
          python -c 'import json,os; print(json.dumps({k:os.environ[k] for k in ("GITHUB_SHA","GITHUB_RUN_ID","GITHUB_RUN_ATTEMPT","GITHUB_REF")}))' | tee "$RUNNER_TEMP/p113-fresh-native/_fresh-science/ci-identity.json"
      - name: Run the separate scalar matcher regression suite
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            cd "$RUNNER_TEMP/p113-fresh-native"
            LOG=_fresh-science/scalar-tests.log
          else
            mkdir -p scalar-regression-output
            LOG=scalar-regression-output/glob-tests.log
          fi
          timeout --signal=TERM --kill-after=5s 30s python -B scalar_tests/test_glob_matches.py -v 2>&1 | tee "$LOG"
      - name: Run finite and synthetic scientific gates exactly once
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            cd "$RUNNER_TEMP/p113-fresh-native"
            export TMPDIR="$PWD/_fresh-science/tmp"
            LOG=_fresh-science/driver.log
          else
            mkdir -p scalar-regression-output
            LOG=scalar-regression-output/scientific-driver.log
          fi
          CPU=$(python -c 'import os; print(min(os.sched_getaffinity(0)))')
          ulimit -t 900
          ulimit -v 2097152
          timeout --signal=TERM --kill-after=15s 1200s taskset -c "$CPU" python -B scripts/run_scientific_checks.py 2>&1 | tee "$LOG"
      - name: Require fresh source-bound native evidence on the reviewed main push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/p113-fresh-native"
          timeout --signal=TERM --kill-after=5s 60s python -B scripts/assemble_fresh_science.py collect --workdir "$PWD" 2>&1 | tee _fresh-science/assembler.log
      - name: Retain raw outputs even when a gate fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owned-offline-model-output
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            scalar-regression-output/
            scientific-check-output/
            tosem/results/
            fse/results/unit_tests.json
            fse/results/finite_semantics_audit.json
            results/repair_audit.json
            ${{ runner.temp }}/p113-assembler-guards/
            ${{ runner.temp }}/p113-assembler-guards.log
            ${{ runner.temp }}/p113-consumer-tests.log
            ${{ runner.temp }}/p113-fresh-prepare.log
            ${{ runner.temp }}/p113-fresh-native/_fresh-science/
            ${{ runner.temp }}/p113-fresh-native/fresh-native-evidence/
            ${{ runner.temp }}/p113-fresh-native/scientific-check-output/
            ${{ runner.temp }}/p113-fresh-native/tosem/results/
            ${{ runner.temp }}/p113-fresh-native/fse/results/
            ${{ runner.temp }}/p113-fresh-native/results/
