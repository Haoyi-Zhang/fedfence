name: Scientific checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owned-offline-models:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONOPTIMIZE: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run finite and synthetic scientific gates
        shell: bash
        run: |
          ulimit -t 900
          ulimit -v 2097152
          timeout --signal=TERM --kill-after=15s 1200s python -B scripts/run_scientific_checks.py
      - name: Retain raw outputs even when a gate fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owned-offline-model-output
          if-no-files-found: warn
          path: |
            scientific-check-output/
            tosem/results/
            fse/results/unit_tests.json
            fse/results/finite_semantics_audit.json
            results/repair_audit.json
