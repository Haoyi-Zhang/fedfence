name: Fresh owned native evidence (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p113-fresh-owned-native-evidence
  cancel-in-progress: false
jobs:
  fresh-owned-offline-models:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONOPTIMIZE: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Check assembler guards separately (not ordinary or scalar count)
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 60s python -B fresh_science_tests/test_assembler.py --out "$RUNNER_TEMP/p113-assembler-guards" -v 2>&1 | tee "$RUNNER_TEMP/p113-assembler-guards.log"
      - name: Prepare a new source-bound execution copy
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/assemble_fresh_science.py prepare --source "$GITHUB_WORKSPACE" --workdir "$RUNNER_TEMP/p113-fresh-native" | tee "$RUNNER_TEMP/p113-fresh-prepare.log"
      - name: Separate scalar seven-method regression
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/p113-fresh-native"
          timeout --signal=TERM --kill-after=5s 30s python -B scalar_tests/test_glob_matches.py -v 2>&1 | tee _fresh-science/scalar-tests.log
      - name: Unchanged nine-stage scientific campaign, serial on one CPU
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/p113-fresh-native"
          export TMPDIR="$PWD/_fresh-science/tmp"
          CPU=$(python -c 'import os; print(min(os.sched_getaffinity(0)))')
          printf 'Single allowed CPU: %s\n' "$CPU" | tee _fresh-science/affinity.log
          ulimit -t 900
          ulimit -v 2097152
          timeout --signal=TERM --kill-after=15s 1200s taskset -c "$CPU" python -B scripts/run_scientific_checks.py 2>&1 | tee _fresh-science/driver.log
      - name: Assemble new evidence and require unchanged native audit
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/p113-fresh-native"
          timeout --signal=TERM --kill-after=5s 60s python -B scripts/assemble_fresh_science.py collect --workdir "$PWD" 2>&1 | tee _fresh-science/assembler.log
      - name: Retain complete generated output and guard attempts even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fresh-owned-native-evidence
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/p113-assembler-guards/
            ${{ runner.temp }}/p113-assembler-guards.log
            ${{ runner.temp }}/p113-fresh-prepare.log
            ${{ runner.temp }}/p113-fresh-native/_fresh-science/
            ${{ runner.temp }}/p113-fresh-native/fresh-native-evidence/
            ${{ runner.temp }}/p113-fresh-native/scientific-check-output/
            ${{ runner.temp }}/p113-fresh-native/tosem/results/
            ${{ runner.temp }}/p113-fresh-native/fse/results/
            ${{ runner.temp }}/p113-fresh-native/results/
